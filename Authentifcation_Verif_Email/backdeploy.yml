apiVersion: apps/v1
kind: Deployment
metadata:
  name: backspring
  namespace: my-app
spec:
  replicas: 2  # Nombre de pods backend
  selector:
    matchLabels:
      app: backspring
  template:
    metadata:
      labels:
        app: backspring
    spec:
      containers:
        - name: backspring
          image: souhirks/backendspring:latest  # Remplace par ton image Docker
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/Regiter?serverTimezone=UTC"
            - name: SPRING_DATASOURCE_USERNAME
              value: "root"
---
apiVersion: v1
kind: Service
metadata:
  name: backspring
  namespace: my-app
spec:
  type: NodePort
  selector:
    app: backspring
  ports:
    - protocol: TCP
      port: 8080
